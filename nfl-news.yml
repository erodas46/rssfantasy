name: NFL News Feed

on:
  schedule:
    # Times are UTC. These land at roughly 7am / 1pm / 8pm US Eastern.
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python fetch_nfl_news.py

      - name: Commit updated feed
        run: |
          git config user.name "nfl-news-bot"
          git config user.email "actions@github.com"
          git add nfl-news-feed-2026.md seen_items.json
          git diff --cached --quiet || git commit -m "Update NFL news feed $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
